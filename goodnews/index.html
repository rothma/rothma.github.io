<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 — Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            background-color: #fcfcfc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .code { font-size: 6rem; font-weight: 600; letter-spacing: -0.04em; margin: 0; }
        .msg { font-size: 1rem; color: #6b7280; margin-top: 0.5rem; font-weight: 300; }
        a { color: #1a1a1a; text-decoration: underline; text-underline-offset: 4px; }
    </style>
</head>
<body>
    <div>
        <p class="code">404</p>
        <p class="msg">This page does not exist. <a href="/">Return home</a>.</p>
    </div>
</body>
</html>
